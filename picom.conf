// ~/.config/picom/picom.conf
// Tuned for Intel Ironlake iGPU - xrender backend only (no glx/vulkan)

backend = "xrender";
vsync = false;              // xrender + vsync can cause tearing/perf issues on old iGPUs; test both

# --- shadows ---
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.55;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-exclude = [
    "class_g = 'slstatus'",
    "class_g = 'dunst'",
    "_GTK_FRAME_EXTENTS@:c"
];

# --- opacity ---
inactive-opacity = 0.92;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

opacity-rule = [
    "90:class_g = 'st' && focused",
    "80:class_g = 'st' && !focused",
    "100:class_g = 'rofi'"
];

# --- fading ---
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 4;

# --- corners (requires patched picom, e.g. jonaburg/ibhagwan fork) ---
corner-radius = 8;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "class_g = 'slstatus'"
];

# --- blur (xrender backend supports only basic blur methods) ---
blur: {
    method = "box";
    size = 4;
    deviation = 5.0;
};
blur-background-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'"
];

# --- general ---
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;

wintypes:
{
    dock = { shadow = false; };
    dnd = { shadow = false; };
    popup_menu = { opacity = 1.0; };
    dropdown_menu = { opacity = 1.0; };
};
